[package]
name = "r8s-plugin"
version = "0.1.0"
edition = "2021"
authors = ["R8s Team"]
description = "Plugin system for the r8s workflow orchestrator"

[dependencies]
# Internal crates
r8s-core = { path = "../r8s-core" }

# Workspace dependencies
tokio = { workspace = true }
